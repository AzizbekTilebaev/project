# Namuna: HTTPS terminalidan keyin domenni almashtiring.
# upstream Node: systemd docs/deploy/qp-api.service (Restart=always) → 127.0.0.1:5000
# Uptime: keyword monitor "status":"ok" — docs/deploy/OPS.md

server {
    listen 80;
    server_name example.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.uz;

    # ssl_certificate     /etc/letsencrypt/live/example.uz/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/example.uz/privkey.pem;

    client_max_body_size 30m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

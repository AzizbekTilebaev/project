# Lokal sintaksis tekshiruvi: nginx -t -c $PWD/docs/deploy/nginx.local-test.conf
# Haqiqiy sertifikat yo‘q — faqat conf strukturasi.
# pid / error_log vaqtincha /tmp ga (root’siz -t uchun).

pid /tmp/qp-nginx-test.pid;
error_log /tmp/qp-nginx-test.log;
worker_processes 1;

events {
    worker_connections 64;
}

http {
    access_log off;

    server {
        listen 18080;
        server_name localhost;

        client_max_body_size 30m;

        location / {
            proxy_pass http://127.0.0.1:5010;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /socket.io/ {
            proxy_pass http://127.0.0.1:5010;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400;
        }
    }
}
